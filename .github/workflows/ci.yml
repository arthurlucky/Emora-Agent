name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Syntax check (all JS in core/, tools/, cli/, bin/, provider/, tui/)
        run: |
          find core tools cli bin provider tui utils gateway -name "*.js" -not -path "*/node_modules/*" \
            -print0 | xargs -0 -n1 node --check

      - name: Run tests
        run: node --test tools/__tests__/*.test.js core/__tests__/*.test.js
