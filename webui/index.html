<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0a0e12">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>EMORA Agent Control Panel</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/styles/main.css">
  <link rel="stylesheet" href="/src/style.css">
  
  <!-- Interactive Widgets Dependencies -->
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10.8.0/dist/mermaid.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  
  <script>
    window.addEventListener('error', function(e) {
      console.error('[EMORA FATAL UI ERROR]', e.error || e.message);
      var app = document.getElementById('app');
      if (app && !app.children.length) {
        app.innerHTML = '<div style="padding:40px;text-align:center;color:#e6edf3;font-family:sans-serif;max-width:500px;margin:50px auto;background:#10151c;border:1px solid #313c4a;border-radius:12px;">' +
          '<h3 style="color:#e5566b;font-size:18px;">⚠️ Gagal Memuat Web UI</h3>' +
          '<p style="font-size:12px;color:#a9b6c2;margin:12px 0;">' + (e.message || 'Error module loading') + '</p>' +
          '<button style="padding:10px 16px;background:#4fd8c4;border:none;border-radius:6px;color:#0a0e12;font-weight:bold;cursor:pointer;" onclick="localStorage.clear();location.reload();">Reload & Reset</button>' +
          '</div>';
      }
    });
  </script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
